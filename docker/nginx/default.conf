server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Unauthenticated liveness endpoint. The container healthcheck hits this, so
    # it must stay reachable when basic auth is on -- otherwise every deploy is
    # reported as unhealthy.
    location = /healthz {
        auth_basic off;
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Written at container start by 40-basic-auth.sh: contains the auth_basic
    # directives when BASIC_AUTH_USER/BASIC_AUTH_PASSWORD are set, and nothing
    # at all when they are not.
    include /etc/nginx/auth.d/*.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript application/javascript application/json image/svg+xml application/manifest+json;
}
