# Coolify deployment with a self-hosted collaboration (websocket) server.
#
# Same setup as `docker-compose.coolify.yml`, plus `excalidraw-room`, which
# carries the live collaboration traffic so sessions never leave your server.
#
# Before the first deploy set VITE_APP_WS_SERVER_URL in Coolify's environment
# variables to the public URL Coolify assigns to the `excalidraw-room` service
# (e.g. https://collab.example.com). It is compiled into the frontend bundle,
# so it cannot be changed without a rebuild.
#
# Note: the room server handles the live session only. Persisting a shared scene
# (so someone joining late sees it) still goes through the Firebase project in
# VITE_APP_FIREBASE_CONFIG, and "Export to link" still goes through
# VITE_APP_BACKEND_V2_*, both of which default to Excalidraw's public services.
# Override them if you want those fully self-hosted too.

services:
  excalidraw:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
        VITE_APP_WS_SERVER_URL: ${VITE_APP_WS_SERVER_URL:-}
        VITE_APP_BACKEND_V2_GET_URL: ${VITE_APP_BACKEND_V2_GET_URL:-}
        VITE_APP_BACKEND_V2_POST_URL: ${VITE_APP_BACKEND_V2_POST_URL:-}
        VITE_APP_FIREBASE_CONFIG: ${VITE_APP_FIREBASE_CONFIG:-}
        VITE_APP_AI_BACKEND: ${VITE_APP_AI_BACKEND:-}
        VITE_APP_LIBRARY_URL: ${VITE_APP_LIBRARY_URL:-}
        VITE_APP_LIBRARY_BACKEND: ${VITE_APP_LIBRARY_BACKEND:-}
    # Domain is assigned in Coolify's UI; see the note in docker-compose.coolify.yml
    # for why there is no `environment:` block here.
    expose:
      - "80"
    restart: unless-stopped
    depends_on:
      - excalidraw-room
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  excalidraw-room:
    image: excalidraw/excalidraw-room:latest
    # Give the websocket server its own domain in Coolify (General -> Domains);
    # that domain is what VITE_APP_WS_SERVER_URL has to point at.
    # Mapping form, not a list -- see the note in docker-compose.coolify.yml.
    environment:
      PORT: "80"
    expose:
      - "80"
    restart: unless-stopped
